<label class="nexa-switch">
  <input
    class="nexa-switch__input"
    type="checkbox"
    role="switch"
    [attr.id]="id()"
    [attr.name]="name()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    (change)="onInput($event)"
    (blur)="onBlur()"
  />
  <span [class]="trackClasses()" aria-hidden="true"><span class="nexa-switch__knob"></span></span>
  <span class="nexa-switch__label"><ng-content /></span>
</label>
