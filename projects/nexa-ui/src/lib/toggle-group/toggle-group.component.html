<div class="nexa-toggle-group" role="group" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="nexa-toggle-group__btn nexa-focus-ring"
      [class.nexa-toggle-group__btn--pressed]="isPressed(option)"
      [attr.aria-pressed]="isPressed(option)"
      [disabled]="option.disabled || disabled()"
      (click)="toggle(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
