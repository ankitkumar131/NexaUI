<div class="nexa-popover" (keydown)="onKeydown($event)">
  <div
    class="nexa-popover__trigger"
    role="button"
    tabindex="0"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    (keydown.space)="toggle(); $event.preventDefault()"
  >
    <ng-content select="[slot=trigger]" />
  </div>
  @if (rendered()) {
    <div
      [class]="panelClasses()"
      [class.nexa-popover__panel--closing]="closing()"
      role="dialog"
      [id]="panelId()"
      [attr.aria-label]="ariaLabel()"
      [style.width]="width()"
      (click)="$event.stopPropagation()"
    >
      <ng-content />
    </div>
  }
</div>
