@if (open()) {
  <div class="nexa-drawer" (keydown.escape)="requestClose()">
    <div class="nexa-drawer__backdrop" (click)="requestClose()"></div>
    <aside
      [class]="panelClasses()"
      [style.width]="panelStyle().width ?? null"
      [style.height]="panelStyle().height ?? null"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? titleId() : null"
      [attr.aria-describedby]="description() ? descId() : null"
      tabindex="-1"
      autofocus
      (click)="$event.stopPropagation()"
    >
      @if (title() || showClose()) {
        <div class="nexa-drawer__header">
          <div>
            @if (title()) {
              <h2 class="nexa-drawer__title" [id]="titleId()">{{ title() }}</h2>
            }
            @if (description()) {
              <p class="nexa-drawer__desc" [id]="descId()">{{ description() }}</p>
            }
          </div>
          @if (showClose()) {
            <button type="button" class="nexa-drawer__close nexa-focus-ring" aria-label="Close panel" (click)="requestClose()">✕</button>
          }
        </div>
      }
      <div class="nexa-drawer__body"><ng-content /></div>
      <div class="nexa-drawer__footer"><ng-content select="[slot=footer]" /></div>
    </aside>
  </div>
}
